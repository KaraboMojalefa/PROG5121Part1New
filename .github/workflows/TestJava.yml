name: Java Tests

on:
  push:
    branches: [ "QuickChatPart2" ]
  pull_request:
    branches: [ "QuickChatPart2" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests
        run: mvn -B test